<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integrations | Evo Support</title>
  <link rel="stylesheet" href="/app.css?v=20260207t">
  <script src="/ui.js" defer></script>
  <script src="/admin-integrations.js?v=20260316a" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="/">Evo Support</a>
    </div>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/tickets.html" data-auth="user">My Tickets</a>
      <a href="/staff.html" data-auth="staff">Staff</a>
      <a href="/admin.html" data-auth="admin">Admin</a>
      <a href="/api/logout" data-auth="user">Logout</a>
    </nav>
  </header>
  <main class="site-main">
    <section class="page-header">
      <div>
        <h1>Integrations</h1>
        <p>Configure Payhip webhook validation and Discord purchase notifications.</p>
      </div>
    </section>

    <section class="card">
      <form class="form" data-integrations-form autocomplete="off">
        <label>
          Payhip API key
          <input type="text" name="PAYHIP_API_KEY" placeholder="Payhip webhook signature key">
        </label>
        <label>
          Discord webhook URL
          <input type="text" name="DISCORD_WEBHOOK_URL" placeholder="https://discord.com/api/webhooks/...">
        </label>
        <p class="muted" style="margin: 0;">
          Leave blank to use environment variable defaults.
        </p>
        <div class="inline" style="margin: 0;">
          <button class="btn" type="submit">Save integrations</button>
          <span class="muted" data-save-status></span>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <span>Need help? Open a ticket and we will get back to you.</span>
  </footer>
</body>
</html>
